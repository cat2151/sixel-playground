[package]
name = "wav-viewer-ratatui"
version = "0.1.0"
edition = "2021"
description = "TUI application for displaying WAV file waveforms using ratatui-image"

[[bin]]
name = "wav-viewer-ratatui"
path = "src/main.rs"

[dependencies]
crossterm = "0.29.0"
hound = "3.5.1"
image = { version = "0.25.10", default-features = false }
ratatui = { version = "0.30.0", default-features = false, features = ["crossterm"] }
ratatui-image = { version = "10.0.6", default-features = false, features = ["crossterm"] }
wave-chart = { path = "../../crates/wave-chart" }
